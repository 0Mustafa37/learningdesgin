<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Backend Atlas</title>
  <meta name="description" content="Animated system design lessons and senior Django interview questions." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='6' fill='%23c9e4a8' stroke='%231d1b18' stroke-width='2.5'/%3E%3Cpath d='M10 21l6-10 6 10' fill='none' stroke='%231d1b18' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open course menu">☰</button>
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="26" height="26"><rect x="3" y="3" width="26" height="26" rx="6" fill="var(--accent)" stroke="var(--ink)" stroke-width="2.5"/><path d="M10 21l6-10 6 10" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/></svg>
      </span>
      <span>Backend <mark>Atlas</mark></span>
    </a>
    <button class="search-trigger" id="searchBtn">
      <span>⌕ Search lessons &amp; questions…</span><kbd>Ctrl K</kbd>
    </button>
    <div class="top-actions">
      <a class="pill-link" href="#/django">Django Q&amp;A</a>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">◐</button>
    </div>
  </header>

  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar" aria-label="Course navigation"></aside>
    <main class="main" id="main"></main>
    <aside class="aside" id="aside"></aside>
  </div>
  <div class="scrim" id="scrim"></div>

  <div class="modal" id="searchModal" role="dialog" aria-modal="true" aria-label="Search" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <input id="searchInput" type="search" placeholder="Search lessons, concepts, Django questions…" autocomplete="off" />
        <kbd>esc</kbd>
      </div>
      <ul class="search-results" id="searchResults"></ul>
    </div>
  </div>

  <script src="data/lessons.js"></script>
  <script src="data/django.js"></script>
  <script src="app.js"></script>
</body>
</html>
