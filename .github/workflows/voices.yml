name: voices
# Generates lesson narration with Gemini TTS. Needs the repository secret GEMINI_API_KEY
# (create a key at https://aistudio.google.com/apikey). Runs daily until every step has audio.
on:
  workflow_dispatch:
    inputs:
      max: { description: "Files to generate in this run", default: "90" }
      engine: { description: "edge (free, no daily limit, Egyptian neural voices) or gemini (needs billing for volume)", default: "edge" }
      voice: { description: "English voice; blank = default (edge: en-US-AndrewMultilingualNeural, gemini: Kore)", default: "" }
      ar_voice: { description: "Egyptian voice; blank = default (edge: ar-EG-ShakirNeural or ar-EG-SalmaNeural, gemini: Sulafat)", default: "" }
      only: { description: "Only keys matching this regex (blank = all)", default: "" }
      lang: { description: "en, ar or both", default: "both" }
  schedule:
    - cron: "17 2 * * *"
permissions:
  contents: write
concurrency: { group: voices, cancel-in-progress: false }
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONUNBUFFERED: "1"
      DEADLINE_MIN: "160"
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no key
        id: key
        run: if [ -z "$GEMINI_API_KEY" ]; then echo "No GEMINI_API_KEY secret yet; nothing to do."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.key.outputs.skip != '1'
        with: { python-version: "3.12" }
      - name: Install
        if: steps.key.outputs.skip != '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install playwright edge-tts && python -m playwright install --with-deps chromium
      - name: Generate
        if: steps.key.outputs.skip != '1'
        run: python tools/make_voices.py --max "${{ github.event.inputs.max || '90' }}" --engine "${{ github.event.inputs.engine || 'edge' }}" --voice "${{ github.event.inputs.voice }}" --ar-voice "${{ github.event.inputs.ar_voice }}" --only "${{ github.event.inputs.only }}" --lang "${{ github.event.inputs.lang || 'both' }}"
      - name: Commit (also after a failure, so finished work is kept)
        if: always() && steps.key.outputs.skip != '1'
        run: |
          git add assets/voice
          if git diff --cached --quiet; then echo "No new audio."; exit 0; fi
          git -c user.name="atlas-voices" -c user.email="actions@users.noreply.github.com" commit -m "Narration: $(git diff --cached --name-only -- '*.mp3' | wc -l) new audio files, scripts updated"
          git pull --rebase -q && git push
